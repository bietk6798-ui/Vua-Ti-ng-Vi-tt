<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vua Tiếng Việt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .container {
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid #3b82f6;
    border-radius: 20px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 8px;
    color: #fbbf24;
  }
  .subtitle {
    text-align: center;
    color: #93c5fd;
    margin-bottom: 24px;
    font-size: 0.95rem;
  }
  .modes {
    display: grid;
    gap: 14px;
  }
  .mode-btn {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    border: none;
    color: white;
    padding: 18px;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .mode-btn:active { transform: scale(0.97); }
  .mode-btn.rebus {
    background: linear-gradient(135deg, #06b6d4, #0891b2);
  }
  .game {
    display: none;
  }
  .game.active { display: block; }
  .question {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 12px;
    text-align: center;
  }
  .hint {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .choices {
    display: grid;
    gap: 10px;
  }
  .choice {
    background: #1e293b;
    border: 2px solid #334155;
    color: white;
    padding: 14px;
    border-radius: 12px;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
  }
  .choice:hover { border-color: #3b82f6; }
  .choice.correct { background: #065f46; border-color: #10b981; }
  .choice.wrong { background: #7f1d1d; border-color: #ef4444; }
  .score {
    text-align: center;
    margin: 16px 0;
    font-size: 1.1rem;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary {
    background: #3b82f6;
    color: white;
  }
  .btn-secondary {
    background: #334155;
    color: white;
  }
  .result {
    text-align: center;
    display: none;
  }
  .result.active { display: block; }
  .result h2 { color: #fbbf24; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="container">
    <!-- Màn hình chọn chế độ -->
    <div id="home">
      <h1>👑 VUA TIẾNG VIỆT</h1>
      <p class="subtitle">Chơi thông minh – Vững tiếng Việt</p>
      <div class="modes">
        <button class="mode-btn" onclick="startGame('hard')">🧠 Chế độ Khó</button>
        <button class="mode-btn rebus" onclick="startGame('easy')">🖼️ Đuổi hình bắt chữ</button>
      </div>
    </div>

    <!-- Màn hình chơi -->
    <div class="game" id="game">
      <div class="question" id="question"></div>
      <div class="hint" id="hint"></div>
      <div class="choices" id="choices"></div>
      <div class="score">Điểm: <span id="score">0</span> / <span id="total">0</span></div>
      <div class="controls">
        <button class="btn btn-secondary" onclick="goHome()">← Về trang chủ</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none">Câu tiếp →</button>
      </div>
    </div>

    <!-- Kết quả -->
    <div class="result" id="result">
      <h2>🏆 Hoàn thành!</h2>
      <p id="finalScore"></p>
      <br>
      <button class="btn btn-primary" onclick="goHome()">Chơi lại</button>
    </div>
  </div>
